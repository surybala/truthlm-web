[project]
name = "orl-web"
version = "0.1.0"
description = "Independent public question, voting, and publishing service for Open Research Lab"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
orl-web = "orl_web.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orl_web*"]

[tool.setuptools.package-data]
orl_web = ["contracts/v1/*.json", "static/**/*", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spec(*ids): links tests to requirements in specs/SPEC-WEB.md"]

[tool.coverage.run]
source = ["orl_web"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
