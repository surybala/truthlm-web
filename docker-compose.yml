services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orl_web
      POSTGRES_USER: orl_web
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - orl-web-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orl_web"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orl-web-postgres:
